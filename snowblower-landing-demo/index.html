<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Snowblower Repair & Tune-Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes check-pop {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .option-check-pop { animation: check-pop 200ms ease-out forwards; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes cta-bump {
      0%, 88%, 100% { transform: scale(1); }
      92% { transform: scale(1.03); }
      96% { transform: scale(1); }
    }
    .hero-cta-bump { animation: cta-bump 8s ease-in-out infinite; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) {
      .hero-cta-bump { animation: none; }
    }
  </style>
</head>
</html>
